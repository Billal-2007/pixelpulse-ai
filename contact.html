<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PixelPulse AI (PPAI)</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131d31; --text-color: #f1f5f9; --accent-color: #38bdf8; --border-color: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        h1 { color: var(--accent-color); margin-bottom: 15px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        input, textarea { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        button { padding: 10px 20px; background: var(--accent-color); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        .back-home { display: inline-block; margin-top: 15px; color: var(--accent-color); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Send Direct Feedback</h1>
        <p>Have questions, suggestions, or feedback about PixelPulse AI? Send us a message below.</p>
        <form onsubmit="event.preventDefault(); alert('Feedback sent successfully!');">
            <div class="form-group">
                <label style="font-size: 13px; color:#94a3b8;">Your Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; color:#94a3b8;">Your Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label style="font-size: 13px; color:#94a3b8;">Message</label>
                <textarea rows="4" placeholder="Write your feedback..." required></textarea>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>
</body>
</html>
