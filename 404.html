<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | PixelPulse AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; }
        .error-card { background: var(--card-bg); padding: 40px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 500px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 80px; color: var(--accent-color); margin-bottom: 10px; }
        h2 { font-size: 24px; margin-bottom: 15px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        a { display: inline-block; padding: 12px 25px; background: var(--accent-color); color: #fff; font-weight: bold; text-decoration: none; border-radius: 8px; transition: background 0.2s; }
        a:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html">&larr; Back to Home</a>
    </div>
</body>
</html>
