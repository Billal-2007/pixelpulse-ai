<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PixelPulse AI</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131d31; --text-color: #f1f5f9; --accent-color: #38bdf8; --border-color: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-card { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: var(--accent-color); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        button { width: 100%; padding: 12px; background: var(--accent-color); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        .back-home { display: inline-block; margin-top: 15px; color: var(--accent-color); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="admin-card" id="loginBox">
        <h2>Admin Authentication</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="checkLogin()">Login to Dashboard</button>
        <br>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <div class="admin-card" id="dashboardBox" style="display:none; max-width: 600px; text-align: left;">
        <h2>PPAI Admin Dashboard</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Welcome Admin! System status is 100% operational via Firebase backend.</p>
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 15px;">
            <p><strong>Total Visitors:</strong> 1,248</p>
            <p><strong>Active API Engines:</strong> Pexels, Pixabay, Unsplash, FreeSound</p>
        </div>
        <button onclick="location.href='index.html'" style="background:#ef4444;">Logout / Return Home</button>
    </div>

    <script>
        function checkLogin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'admin123' || pass === 'billal') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                alert('Incorrect password! Try again.');
            }
        }
    </script>
</body>
</html>
