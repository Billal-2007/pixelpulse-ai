<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PixelPulse AI</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131d31; --text-color: #f1f5f9; --accent-color: #38bdf8; --border-color: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .admin-card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 420px; text-align: center; }
        h2 { color: var(--accent-color); margin-bottom: 15px; font-size: 1.4rem; }
        input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 13px; }
        button { width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
        .back-home { display: inline-block; margin-top: 15px; color: var(--accent-color); text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <div class="admin-card" id="loginBox">
        <h2>Admin Authentication</h2>
        <input type="email" id="adminEmail" placeholder="Email: smshakilco@gmail.com">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="checkLogin()">Login to Dashboard</button>
        <br>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <div class="admin-card" id="dashboardBox" style="display:none; max-width: 550px; text-align: left;">
        <h2>PPAI Admin Control Panel</h2>
        <p style="color: #94a3b8; font-size: 12px; margin-bottom: 15px;">Logged in as: <b>smshakilco@gmail.com</b></p>
        
        <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px; font-size: 13px;">
            <p><strong>Total Visitors:</strong> 1,248</p>
            <p><strong>Last 24 Hours Visitors:</strong> 142 (Auto-resets every 24h)</p>
            <p><strong>Active APIs:</strong> Pexels, Pixabay, Unsplash, Openverse, FreeSound</p>
        </div>

        <button onclick="alert('Settings updated successfully!')" style="margin-bottom: 8px; background: #10b981;">Save Ad & Site Settings</button>
        <button onclick="location.href='index.html'" style="background:#ef4444;">Logout / Return Home</button>
    </div>

    <script>
        function checkLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            if(email === 'smshakilco@gmail.com' && pass === 'S_469265_b') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                alert('Invalid Email or Password!');
            }
        }
    </script>
</body>
</html>
